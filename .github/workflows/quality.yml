name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend-and-rust:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            libdbus-1-dev \
            libkeyutils-dev \
            pkg-config
      - run: npm ci
      - run: npm run test:release-preflight
      - run: npm run test:windows-signing-config
      - name: Build pinned Linux sidecars for Rust checks
        run: |
          bash scripts/install-ffmpeg-sidecar-linux.sh
          bash scripts/build-whisper-sidecar-linux.sh
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

  macos-sidecars:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: npm ci
      - name: Rebuild and verify macOS 12 compatible Whisper sidecars
        run: bash scripts/build-whisper-sidecars-macos.sh
      - name: Verify sidecar deployment targets and signatures
        run: |
          for binary in src-tauri/binaries/whisper-cli-aarch64-apple-darwin src-tauri/binaries/whisper-cli-x86_64-apple-darwin; do
            test "$(xcrun vtool -show-build "$binary" | awk '/minos/{print $2; exit}')" = "12.0"
            codesign --verify --strict "$binary"
            test -z "$(otool -L "$binary" | tail -n +2 | awk '{print $1}' | grep -Ev '^(/usr/lib/|/System/Library/Frameworks/)' || true)"
          done
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib
